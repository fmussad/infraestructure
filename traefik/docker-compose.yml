services:
  traefik:
    image: traefik:v3.6
    container_name: felixmussa-traefik
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - felixmussa_net
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.redirect-to-landing.redirectregex.regex=.*
      - traefik.http.middlewares.redirect-to-landing.redirectregex.replacement=/landing
      - traefik.http.middlewares.redirect-to-landing.redirectregex.permanent=true
      - traefik.http.routers.root.rule=Path(`/`)
      - traefik.http.routers.root.entrypoints=web
      - traefik.http.routers.root.middlewares=redirect-to-landing
      - traefik.http.routers.root.service=noop@docker
      - traefik.http.routers.root.priority=1000

  noop:
    image: traefik/whoami:v1.10
    container_name: felixmussa-noop
    restart: unless-stopped
    networks:
      - felixmussa_net
    labels:
      - traefik.enable=true
      - traefik.http.services.noop.loadbalancer.server.port=80

networks:
  felixmussa_net:
    external: true
    name: felixmussa_net
